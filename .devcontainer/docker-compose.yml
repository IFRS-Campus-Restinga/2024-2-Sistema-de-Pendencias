name: sistema-progressoes-ifrs

services:
  backend:
    build:
      context: ..
      dockerfile: .devcontainer/backend.Dockerfile
    working_dir: /workspace/backend
    env_file: ../backend/.env
    environment:
      ENVIRONMENT: "dev"
    volumes:
      - ..:/workspace:cached
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost', 8001), timeout=5).close()\" 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks:
      ifrs-dev-network:
        aliases:
          - progressoes-backend
          - sistema-progressoes-backend

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    working_dir: /workspace/frontend
    env_file: ../frontend/.env
    volumes:
      - ..:/workspace:cached
      - progressoes_node_modules:/workspace/frontend/node_modules
    ports:
      - "3001:3001"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      ifrs-dev-network:
        aliases:
          - progressoes-frontend
          - sistema-progressoes-frontend

volumes:
  progressoes_node_modules:

networks:
  ifrs-dev-network:
    external: true
