name: sistema-progressoes-ifrs

services:
  backend:
    build:
      context: ..
      dockerfile: .devcontainer/backend.Dockerfile
    working_dir: /workspace/backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file: ../backend/.env
    environment:
      ENVIRONMENT: "dev"
    volumes:
      - ..:/workspace:cached
    expose:
      - "8000"
    networks:
      ifrs-dev-network:
        aliases:
          - progressoes-backend
          - sistema-progressoes-backend

  frontend:
    image: node:20-alpine
    working_dir: /workspace/frontend
    command: sh -c "npm install && npx react-scripts start"
    env_file: ../frontend/.env
    volumes:
      - ..:/workspace:cached
      - progressoes_node_modules:/workspace/frontend/node_modules
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      ifrs-dev-network:
        aliases:
          - progressoes-frontend
          - sistema-progressoes-frontend

volumes:
  progressoes_node_modules:

networks:
  ifrs-dev-network:
    external: true
